services:
  postgres:
    container_name: scalable-worker-postgres-dev
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${PG_SCALABLE_WORKERS_DB}
      POSTGRES_USER: ${PG_SCALABLE_WORKERS_USER}
      POSTGRES_PASSWORD: ${PG_SCALABLE_WORKERS_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: scalable-worker-redis-dev
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_SCALABLE_WORKERS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: scalable-worker-rabbitmq-dev
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"

volumes:
  pgdata: